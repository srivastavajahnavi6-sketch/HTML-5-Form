<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align:center;">html 5 Form</h1>
    <form style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start;" action="">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name"><br>
        <label for="email">Email:</label>
        <input type="email"name="email" id="email"><br>
        <label for="password">Password</label>
        <input type="password" name="password" id="password"><br>
        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="male" value="male"><br>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female"><br>
        <label for="female">Female</label>
        <label for="country">country:</label>
        <select name="country" id="country">
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
        </select><br>

        <label for="hobbies">Hobbies:</label><br>
        <label for="reading">Reading</label>
        <input type="checkbox" name="hobbies" id="traveling" value="traveling">
        <label for="traveling">Traveling</label>
        <input type="checkbox" name="hobbies" id="sports" value="sports">
        <label for="sports">Sports</label>
        <input type="submit" value="submit">


    </form>

<script type="module" src="index.js"></script>
   
</body>
</html>
